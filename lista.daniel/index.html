<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animações CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Exercícios de Animação CSS</h1>

    
    <section>
        <h2>1. Movimento Vertical</h2>

        <div class="palco">
            <div class="caixa vertical">1</div>
        </div>
    </section>


    
    <section>
        <h2>2. Movimento Horizontal</h2>

        <div class="palco">
            <div class="caixa horizontal">2</div>
        </div>
    </section>


    
    <section>
        <h2>3. Movimento Diagonal</h2>

        <div class="palco">
            <div class="caixa diagonal">3</div>
        </div>
    </section>


   
    <section>
        <h2>4. Velocidade e Repetição</h2>

        <div class="palco">
            <div class="caixa velocidade">4</div>
        </div>
    </section>


   
    <section>
        <h2>5. Animação em Etapas</h2>

        <div class="palco">
            <div class="caixa etapas">5</div>
        </div>
    </section>


    
    <section>
        <h2>6. Hover</h2>

        <div class="palco">
            <div class="caixa hover">6</div>
        </div>
    </section>


  
    <section>
        <h2>7. Pausar a Animação</h2>

        <div class="palco">
            <div class="caixa pausa">7</div>
        </div>
    </section>


   
    <section>
        <h2>8. Active</h2>

        <div class="palco">
            <button class="caixa active">8</button>
        </div>
    </section>


   
    <section>
        <h2>9. Focus-Visible</h2>

        <div class="palco">
            <button class="caixa foco">9</button>
        </div>
    </section>

</body>
</html>
